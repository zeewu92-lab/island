<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <!-- 强制浏览器使用亮色模式，防止被手机夜间模式变黑 -->
    <meta name="color-scheme" content="light only">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>漂浮岛屿 - 移动端优化版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; }
        canvas { display: block; }
    </style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    // 1. 基础场景设置
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // 晴天蓝
    scene.fog = new THREE.Fog(0x87CEEB, 30, 100); // 远处雾化

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(20, 15, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // 手机端限制像素比，防卡顿
    document.body.appendChild(renderer.domElement);

    // 鼠标/触摸控制
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;
    controls.target.set(0, 5, 0);

    // 2. 光照系统 (用最基础的材质，必须配足光照)
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); // 环境光调亮
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8); // 主光源
    dirLight.position.set(20, 30, 20);
    scene.add(dirLight);

    // 3. 材质库 (改用 Lambert 材质，手机兼容性100%)
    const matRock = new THREE.MeshLambertMaterial({ color: 0x6b5b45 });
    const matGrass = new THREE.MeshLambertMaterial({ color: 0x5c9e38 });
    const matWood = new THREE.MeshLambertMaterial({ color: 0x8B5A2B });
    const matRoof = new THREE.MeshLambertMaterial({ color: 0x4a3b2c });
    const matWhite = new THREE.MeshLambertMaterial({ color: 0xffffff });

    // 4. 构建岛屿
    const islandGroup = new THREE.Group();
    scene.add(islandGroup);

    // 底层岩石
    const rockGeo = new THREE.ConeGeometry(8, 12, 9);
    rockGeo.rotateX(Math.PI);
    const rock = new THREE.Mesh(rockGeo, matRock);
    rock.position.y = -6;
    islandGroup.add(rock);

    // 顶层草地
    const grassGeo = new THREE.CylinderGeometry(8, 8, 1, 9);
    const grass = new THREE.Mesh(grassGeo, matGrass);
    grass.position.y = 0;
    islandGroup.add(grass);

    // 5. 大树
    const treeGroup = new THREE.Group();
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 1.5, 8, 6), matWood);
    trunk.position.y = 4;
    treeGroup.add(trunk);

    const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(4.5, 0), new THREE.MeshLambertMaterial({ color: 0x3a7d28 }));
    leaves.position.y = 9;
    treeGroup.add(leaves);
    treeGroup.position.set(2, 0.5, -2);
    islandGroup.add(treeGroup);

    // 6. 房子
    function createHouse(x, z, scale) {
        const house = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(3, 2.5, 3), matWhite);
        body.position.y = 1.25;
        house.add(body);
        
        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.8, 1.5, 4), matRoof);
        roof.position.y = 3.25;
        roof.rotation.y = Math.PI / 4;
        house.add(roof);
        
        house.position.set(x, 0.5, z);
        house.scale.set(scale, scale, scale);
        return house;
    }
    islandGroup.add(createHouse(-2, 2, 1));
    islandGroup.add(createHouse(3, 4, 0.8));

    // 7. 云朵生成
    function createCloud(x, y, z) {
        const cloudGroup = new THREE.Group();
        const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        for(let i=0; i<4; i++) {
            const p = new THREE.Mesh(new THREE.IcosahedronGeometry(1.5 + Math.random() * 1.5, 0), cloudMat);
            p.position.set((Math.random()-0.5)*4, (Math.random()-0.5)*2, (Math.random()-0.5)*4);
            cloudGroup.add(p);
        }
        cloudGroup.position.set(x, y, z);
        return cloudGroup;
    }

    const clouds = [];
    // 底部云海
    for(let i=0; i<30; i++) {
        const c = createCloud((Math.random()-0.5)*70, -12 - Math.random()*5, (Math.random()-0.5)*70);
        c.scale.setScalar(1.5);
        scene.add(c);
        clouds.push(c);
    }

    // 8. 动画循环
    const clock = new THREE.Clock();
    function animate() {
        requestAnimationFrame(animate);
        const time = clock.getElapsedTime();
        controls.update();

        // 岛屿浮动
        islandGroup.position.y = Math.sin(time * 0.5) * 0.3;

        // 云朵旋转
        clouds.forEach((cloud, i) => {
            cloud.rotation.y += 0.002;
        });

        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>

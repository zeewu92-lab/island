<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light only">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4">
  <meta name="description" content="語未央：一座隨詞語與花朵一同生長的空中花園。">
  <title>語未央 · 雲上花園</title>
  <style>
    :root { color-scheme: light; --ink: #46594b; --glass: rgba(248,244,235,.78); --berry: #c66f86; --cream: #f3eee4; --sage: #829681; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #e5e8df; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; touch-action: pan-x pan-y; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    .hud { position: fixed; z-index: 2; color: var(--ink); pointer-events: none; user-select: none; }
    .brand { top: max(18px, env(safe-area-inset-top)); left: max(18px, env(safe-area-inset-left)); text-shadow: 0 1px 14px #fff9; }
    .brand strong { display: block; color: #f3eee4; font-size: clamp(19px, 2.8vw, 25px); letter-spacing: .12em; font-weight: 650; text-shadow: 0 2px 12px #172a31c9, 0 0 24px #172a3180; }
    .brand span { display: block; margin-top: 5px; color: #e8e8dd; font-size: 11px; letter-spacing: .18em; opacity: .92; text-shadow: 0 1px 9px #172a31d9; }
    .hint { bottom: max(22px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); padding: 9px 14px; border: 1px solid #ffffff80; border-radius: 999px; background: var(--glass); backdrop-filter: blur(14px); font-size: 12px; white-space: nowrap; box-shadow: 0 8px 30px #40677b18; }
    .tools { right: max(16px, env(safe-area-inset-right)); top: max(16px, env(safe-area-inset-top)); display: flex; gap: 8px; pointer-events: auto; }
    button { min-width: 42px; min-height: 42px; padding: 0 13px; border: 1px solid #ffffffb8; border-radius: 999px; background: var(--glass); color: var(--ink); font: inherit; font-size: 12px; backdrop-filter: blur(14px); box-shadow: 0 5px 22px #40677b18; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button:active { transform: scale(.97); }
    #提示 { position: fixed; inset: 0; display: grid; place-items: center; padding: 28px; color: #294454; text-align: center; background: linear-gradient(#d9eef7, #e5e8df); }
    #提示[hidden] { display: none; }
    #提示 section { max-width: 340px; }
    #提示 h1 { font-size: 22px; font-weight: 600; }
    #提示 p { font-size: 14px; line-height: 1.8; }
    @media (max-width: 420px) { .brand span { letter-spacing: .12em; } .tools { gap: 5px; } button { min-width: 38px; padding: 0 10px; } .hint { font-size: 11px; } }
    @media (prefers-reduced-motion: reduce) { .hint { backdrop-filter: none; } }
  </style>
</head>
<body>
  <div class="hud brand"><strong>語未央</strong><span>詞語生長，花園未央</span></div>
  <div class="hud tools">
    <button id="复位" type="button" aria-label="恢复初始视角">复位视角</button>
  </div>
  <div class="hud hint">滑動環視 · 雙指自由縮放 · 讓花園慢慢生長</div>
  <div id="提示" role="alert" hidden><section><h1>岛屿暂时无法载入</h1><p id="提示文字">请检查网络连接后重新载入页面。若浏览器不支持 WebGL，也可能无法显示三维场景。</p><button onclick="location.reload()">重新载入</button></section></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script>
  (() => {
    "use strict";
    const 提示框 = document.getElementById("提示");
    const 显示错误 = (文字) => {
      提示框.hidden = false;
      document.getElementById("提示文字").textContent = 文字;
    };
    window.addEventListener("error", (事件) => {
      console.error("語未央场景运行错误：", 事件.error || 事件.message);
      显示错误("三维场景发生运行错误：" + (事件.message || "未知错误") + "。请重新载入页面。");
    });
    window.addEventListener("unhandledrejection", (事件) => {
      console.error("語未央场景异步错误：", 事件.reason);
      显示错误("三维场景载入失败，请检查网络连接后重新载入页面。");
    });
    if (!window.THREE || !THREE.OrbitControls) {
      显示错误("三维引擎没有成功载入。请检查网络连接后重新载入页面。");
      return;
    }

    let 渲染器;
    try {
      渲染器 = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
    } catch (错误) {
      显示错误("当前浏览器无法启动 WebGL 三维画面，请尝试更新浏览器或开启图形加速。");
      return;
    }

    const 场景 = new THREE.Scene();
    场景.background = new THREE.Color(0x101a2b);
    场景.fog = new THREE.Fog(0xcbd8d0, 58, 175);
    const 天空参数 = { uniforms: { uSunHeight:{value:0.45}, uTwilight:{value:0}, uNight:{value:0}, uSunDir:{value:new THREE.Vector3(-0.4,0.5,0.6).normalize()}, uTime:{value:0} } };
    const 天空穹顶 = new THREE.Mesh(new THREE.SphereGeometry(220,48,32), new THREE.ShaderMaterial({
      uniforms:天空参数.uniforms, side:THREE.BackSide, depthWrite:false,
      vertexShader:`varying vec3 vDirection; void main(){vDirection=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`precision highp float; varying vec3 vDirection; uniform float uSunHeight; uniform float uTwilight; uniform float uNight; uniform vec3 uSunDir; uniform float uTime;
      float hash(vec3 p){p=fract(p*0.3183099+vec3(0.1,0.2,0.3));p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
      void main(){vec3 d=normalize(vDirection);float h=clamp(d.y*0.5+0.5,0.0,1.0);
      vec3 nightTop=vec3(0.018,0.035,0.085),nightHorizon=vec3(0.10,0.13,0.21);vec3 dayTop=vec3(0.16,0.43,0.70),dayMid=vec3(0.42,0.68,0.83),dayHorizon=vec3(0.83,0.82,0.75);
      vec3 col=mix(nightHorizon,nightTop,pow(h,0.65));col=mix(col,dayHorizon,smoothstep(0.0,0.72,h)*(1.0-uNight));col=mix(col,dayMid,smoothstep(0.16,0.72,h)*(1.0-uNight));col=mix(col,dayTop,smoothstep(0.48,0.98,h)*(1.0-uNight));
      float band=pow(1.0-abs(d.y),5.0);col=mix(col,vec3(0.95,0.38,0.23),clamp(uTwilight*band*0.95,0.0,0.85));float sd=max(dot(d,normalize(uSunDir)),0.0);float disk=smoothstep(0.9992,0.99975,sd)*(1.0-uNight*0.7);float halo=pow(sd,48.0)*(1.0-uNight*0.75);col+=vec3(1.0,0.68,0.35)*halo*0.32+vec3(1.0,0.88,0.66)*disk*2.0;
      float star=step(0.9978,hash(floor(d*850.0)))*smoothstep(0.15,0.85,h)*uNight;col+=vec3(0.75,0.84,1.0)*star*(0.65+0.35*sin(uTime*1.2+hash(floor(d*850.0))*6.28));gl_FragColor=vec4(col,1.0);}`
    }));
    天空穹顶.frustumCulled=false; 场景.add(天空穹顶);
    const 台北日照={日出:6,日落:18,日间比例:0.5,夜间比例:0};
    function 计算台北日出日落(日期=new Date()){
      const 纬度=25.033,经度=121.5654,时区=8;
      const n=Math.floor((Date.UTC(日期.getFullYear(),日期.getMonth(),日期.getDate())-Date.UTC(日期.getFullYear(),0,0))/86400000);
      const g=2*Math.PI/365*(n-1);
      const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
      const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)+0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
      const lat=纬度*Math.PI/180;const ch=Math.cos(90.833*Math.PI/180)/(Math.cos(lat)*Math.cos(dec))-Math.tan(lat)*Math.tan(dec);
      const ha=Math.acos(Math.max(-1,Math.min(1,ch)))*180/Math.PI;const noon=720-4*经度-eq+时区*60;
      return {日出:(noon-4*ha)/60,日落:(noon+4*ha)/60};
    }

    const 相机 = new THREE.PerspectiveCamera(39, innerWidth / innerHeight, 0.1, 240);
    const 初始相机 = new THREE.Vector3(22, 16, 27);
    相机.position.copy(初始相机);

    渲染器.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
    渲染器.setSize(innerWidth, innerHeight);
    渲染器.outputEncoding = THREE.sRGBEncoding;
    渲染器.toneMapping = THREE.ACESFilmicToneMapping;
    渲染器.toneMappingExposure = 1.0;
    document.body.appendChild(渲染器.domElement);
    渲染器.domElement.setAttribute("aria-label", "可旋转观察的三维漂浮岛屿");

    const 控制器 = new THREE.OrbitControls(相机, 渲染器.domElement);
    控制器.enableDamping = true;
    控制器.dampingFactor = 0.085;
    控制器.enablePan = false;
    // 保留自由缩放，近距离观察与远景总览都不做硬性距离锁定。
    控制器.minDistance = 3.8;
    控制器.maxDistance = 100;
    控制器.enableZoom = true;
    控制器.zoomSpeed = 0.82;
    控制器.minPolarAngle = 0.28;
    控制器.maxPolarAngle = Math.PI * 0.49;
    控制器.target.set(0, 2.4, 0);
    控制器.rotateSpeed = 0.78;

    const 环境光 = new THREE.HemisphereLight(0xf0eadc, 0x596b50, 1.15);
    场景.add(环境光);
    const 阳光 = new THREE.DirectionalLight(0xffe6c5, 2.0);
    阳光.position.set(-18, 30, 20);
    场景.add(阳光);
    阳光.castShadow = true;
    阳光.shadow.mapSize.set(1024, 1024);
    阳光.shadow.camera.left = -18;
    阳光.shadow.camera.right = 18;
    阳光.shadow.camera.top = 22;
    阳光.shadow.camera.bottom = -18;
    阳光.shadow.bias = -0.00035;
    渲染器.shadowMap.enabled = true;
    渲染器.shadowMap.type = THREE.PCFSoftShadowMap;

    const 岛屿 = new THREE.Group();
    场景.add(岛屿);
    const 材质 = (颜色, 粗糙度 = 0.9, 其他 = {}) => new THREE.MeshStandardMaterial({ color: 颜色, roughness: 粗糙度, ...其他 });
    const 草材质 = 材质(0x6f8757);
    const 土材质 = 材质(0x927e6b);
    const 石材质组 = [0x706d69, 0x817c72, 0x625f5c, 0x938777].map(色 => 材质(色));
    const 木材质 = 材质(0x8b5938);
    const 木亮材质 = 材质(0xb77c4a);
    const 屋墙材质 = 材质(0xf0dfbd);
    const 屋顶材质 = [0x98594b, 0xb46c55, 0x804a42].map(色 => 材质(色));
    const 叶材质组 = [0x526e50, 0x64835a, 0x78946a, 0x91a77b].map(色 => 材质(色, 0.94, { side: THREE.DoubleSide }));
    const 苔材质 = 材质(0x687f5c);
    let 随机种子 = 0x51a7e;
    function 随机() {
      let t = 随机种子 += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    const 石头随机 = (最小, 最大) => 最小 + 随机() * (最大 - 最小);

    // 用顶点扰动生成不规则岩层，避免岛体像规则倒圆锥。
    function 创建岩层(半径, 高度, 细分, 中心Y, 缩放 = 1) {
      const 几何 = new THREE.ConeGeometry(半径, 高度, 18, 5, false);
      const 顶点 = 几何.attributes.position;
      for (let i = 0; i < 顶点.count; i++) {
        const x = 顶点.getX(i), y = 顶点.getY(i), z = 顶点.getZ(i);
        const 扰动 = 1 + 0.09 * Math.sin(x * 1.7 + z * 0.8) + 0.055 * Math.cos(z * 2.3 - y);
        顶点.setXYZ(i, x * 扰动, y + (Math.abs(y) < 高度 * 0.42 ? Math.sin(x * 1.4 + z) * 0.16 : 0), z * 扰动);
      }
      几何.rotateX(Math.PI);
      几何.computeVertexNormals();
      const 岩石 = new THREE.Mesh(几何, 石材质组[Math.floor(随机() * 石材质组.length)]);
      岩石.position.set(0, 中心Y, 0);
      岩石.scale.setScalar(缩放);
      岩石.castShadow = true;
      岩石.receiveShadow = true;
      岛屿.add(岩石);
      return 岩石;
    }
    创建岩层(7.8, 10.5, 18, -5.1);
    创建岩层(5.4, 5.8, 18, -8.4, 0.96);

    const 草地几何 = new THREE.CylinderGeometry(8.1, 7.55, 0.82, 32, 3);
    const 草顶点 = 草地几何.attributes.position;
    for (let i = 0; i < 草顶点.count; i++) {
      const x = 草顶点.getX(i), y = 草顶点.getY(i), z = 草顶点.getZ(i);
      const 扰动 = 1 + 0.035 * Math.sin(Math.atan2(z, x) * 11) + 0.018 * Math.cos(x * 2.1 + z);
      草顶点.setXYZ(i, x * 扰动, y + (y > 0 ? 0.04 * Math.sin(x * 1.7 + z * 1.3) : 0), z * 扰动);
    }
    草地几何.computeVertexNormals();
    const 草地 = new THREE.Mesh(草地几何, 草材质);
    草地.position.y = -0.12;
    草地.receiveShadow = true;
    草地.castShadow = true;
    岛屿.add(草地);

    // 草地边缘铺设土层和随机碎石，柔化草岩交界。
    const 土边 = new THREE.Mesh(new THREE.TorusGeometry(7.78, 0.24, 5, 48), 土材质);
    土边.rotation.x = Math.PI / 2;
    土边.position.y = -0.31;
    土边.scale.set(1, 0.98, 1);
    岛屿.add(土边);
    for (let i = 0; i < 46; i++) {
      const 角 = 随机() * Math.PI * 2;
      const 半径 = 石头随机(7.3, 8.0);
      const 石几何 = new THREE.DodecahedronGeometry(石头随机(0.12, 0.34), 0);
      const 石头 = new THREE.Mesh(石几何, 石材质组[i % 石材质组.length]);
      石头.position.set(Math.cos(角) * 半径, 石头随机(-0.45, 0.05), Math.sin(角) * 半径);
      石头.rotation.set(随机(), 随机() * 3, 随机());
      石头.scale.set(1.2, 0.65, 0.9);
      石头.castShadow = true;
      岛屿.add(石头);
    }
    for (let i = 0; i < 22; i++) {
      const 角 = 随机() * Math.PI * 2;
      const 半径 = 石头随机(6.9, 7.7);
      const 苔 = new THREE.Mesh(new THREE.SphereGeometry(石头随机(0.16, 0.36), 7, 5), 苔材质);
      苔.position.set(Math.cos(角) * 半径, 石头随机(-2.8, -0.7), Math.sin(角) * 半径);
      苔.scale.set(1.2, 0.45, 0.85);
      岛屿.add(苔);
    }

    // ---------- 小工具 ----------
    const 树随机 = (() => {            // 帶種子的隨機，每次載入同一棵樹
      let a = 20261022;
      return () => {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    })();
    const 随范围 = (最小, 最大) => 最小 + 树随机() * (最大 - 最小);
    const 夹 = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const 平滑 = (t) => { t = 夹(t); return t * t * (3 - 2 * t); };
    const 回弹 = (t) => { t = 夹(t); const c1 = 1.25, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
    
    // ---------- 參數（想調節奏改這裡）----------
    const 树高 = 7.0;
    const 树苗比例 = 0.17;            // 剛出土時樹幹高度占成樹的比例
    const 生长总秒数 = 90;             // 從樹苗到大樹需要幾秒
    const 树状态 = { 进度: 0, 速度: 1, 播放中: true, 上次: performance.now() };
    
    const 树组 = new THREE.Group();
    树组.position.set(2.0, 0.25, -2.0);
    岛屿.add(树组);
    
    // 樹幹高度比例隨進度線性成長（分支出現時間由此反推，確保枝一定長在已經長到的樹幹上）
    const 树干比例 = (p) => 树苗比例 + (1 - 树苗比例) * 夹(p / 0.8);
    const 高度起点 = (y) => 0.8 * 夹((y / 树高 - 树苗比例) / (1 - 树苗比例)) + 0.02;
    
    // 枝條：原點放在底部，之後只靠 scale 控制「長出來」
    function 创建生长枝(起点, 终点, 底半径, 顶半径, 材质对象) {
      const 向量 = new THREE.Vector3().subVectors(终点, 起点);
      const 长 = 向量.length();
      const 几何 = new THREE.CylinderGeometry(顶半径, 底半径, 长, 6, 1);
      几何.translate(0, 长 / 2, 0);
      const 网格 = new THREE.Mesh(几何, 材质对象);
      网格.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), 向量.clone().normalize());
      网格.position.copy(起点);
      网格.scale.set(0.0001, 0.0001, 0.0001);
      网格.castShadow = true;
      树组.add(网格);
      return 网格;
    }
    
    // ---------- 樹幹 ----------
    const 树根 = new THREE.Vector3(0, 0, 0);
    const 树顶 = new THREE.Vector3(0.35, 树高, -0.15);
    const 树干 = 创建生长枝(树根, 树顶, 0.62, 0.16, 木材质);
    const 树干顶 = new THREE.Vector3();   // 目前樹幹頂端位置（每幀更新）
    
    // ---------- 枝條（主枝 + 次枝）----------
    const 树枝组 = [];
    const 叶簇组 = [];
    for (let i = 0; i < 10; i++) {
      const 高 = 2.0 + i * 0.43;
      const 角 = i * 2.399;
      const 长 = 1.0 + Math.sin(i * 1.7) * 0.42;
      const 起点 = 树根.clone().lerp(树顶, 高 / 树高);
      const 终点 = new THREE.Vector3(
        起点.x + Math.sin(角) * 长,
        高 + 0.9 + (i % 3) * 0.24,
        起点.z + Math.cos(角) * 长
      );
      const 主 = {
        网格: 创建生长枝(起点, 终点, 0.22 - i * 0.009, 0.055, 木材质),
        起点, 终点, 父: null, 生长: 0,
        起始: 高度起点(高) + 0.01, 时长: 0.2, 终粗: 1
      };
      树枝组.push(主);
    
      const 次终点 = new THREE.Vector3(
        终点.x + (终点.x - 起点.x) * 0.35 + Math.cos(角) * 0.35,
        终点.y + 0.6,
        终点.z + (终点.z - 起点.z) * 0.35 + Math.sin(角) * 0.35
      );
      const 次 = {
        网格: 创建生长枝(终点, 次终点, 0.085, 0.025, 木亮材质),
        起点: 终点, 终点: 次终点, 父: 主, 生长: 0,
        起始: 主.起始 + 0.13, 时长: 0.18, 终粗: 1
      };
      树枝组.push(次);
    
      // 葉簇長在枝梢：主枝梢 2 簇、次枝梢 2 簇，等枝長到七成才冒出來
      for (const [枝, 点] of [[主, 终点], [次, 次终点]]) {
        for (let k = 0; k < 2; k++) {
          const 位置 = 点.clone().add(new THREE.Vector3(随范围(-0.55, 0.55), 随范围(-0.1, 0.65), 随范围(-0.55, 0.55)));
          const 大小 = 随范围(0.58, 1.1) * (位置.y > 8.4 ? 0.82 : 1);
          const 网格 = new THREE.Mesh(new THREE.SphereGeometry(大小, 10, 8), 叶材质组[Math.floor(树随机() * 叶材质组.length)]);
          网格.position.copy(位置);
          const 目标 = new THREE.Vector3(1.0, 随范围(0.82, 1.18), 0.95);
          网格.scale.set(0.0001, 0.0001, 0.0001);
          网格.rotation.set(树随机(), 树随机() * Math.PI, 树随机());
          网格.castShadow = true;
          网格.receiveShadow = true;
          树组.add(网格);
          叶簇组.push({
            网格, 相位: 树随机() * Math.PI * 2, 原位: 网格.rotation.z,
            目标缩放: 目标, 起始: 枝.起始 + 枝.时长 * 0.7 + 随范围(0, 0.04), 时长: 0.16
          });
        }
      }
    }
    
    // 樹冠頂部：成樹時補幾簇，讓樹梢收得圓一點
    for (let i = 0; i < 6; i++) {
      const 角 = i * 2.399;
      const 位置 = new THREE.Vector3(Math.cos(角) * 随范围(0.3, 1.1), 随范围(7.2, 8.8), Math.sin(角) * 随范围(0.3, 1.1));
      const 网格 = new THREE.Mesh(new THREE.SphereGeometry(随范围(0.6, 0.95), 10, 8), 叶材质组[i % 叶材质组.length]);
      网格.position.copy(位置);
      网格.scale.set(0.0001, 0.0001, 0.0001);
      网格.castShadow = true;
      树组.add(网格);
      叶簇组.push({
        网格, 相位: 树随机() * Math.PI * 2, 原位: 网格.rotation.z,
        目标缩放: new THREE.Vector3(1, 随范围(0.85, 1.1), 0.95), 起始: 0.78 + i * 0.03, 时长: 0.18
      });
    }
    
    // ---------- 樹苗頂芽：永遠跟著樹幹頂端，一路從兩片嫩葉長成樹冠領頭簇 ----------
    const 顶芽组 = [];
    for (let i = 0; i < 3; i++) {
      const 网格 = new THREE.Mesh(new THREE.SphereGeometry(0.5, 10, 8), 叶材质组[(i + 1) % 叶材质组.length]);
      网格.castShadow = true;
      树组.add(网格);
      顶芽组.push({ 网格, 偏移: new THREE.Vector3(Math.cos(i * 2.1) * 0.16, 0.08 + i * 0.05, Math.sin(i * 2.1) * 0.16) });
    }
    
    // ---------- 葉色：嫩綠 → 深綠 ----------
    const 成熟色 = 叶材质组.map(m => m.color.clone());
    const 嫩叶色 = 成熟色.map(c => c.clone().lerp(new THREE.Color(0xd2e08c), 0.55));
    
    // ---------- 每幀更新 ----------
    function 更新树生长() {
      const 现在 = performance.now();
      const 秒差 = Math.min(0.1, (现在 - 树状态.上次) / 1000);
      树状态.上次 = 现在;
      if (树状态.播放中) 树状态.进度 = Math.min(1, 树状态.进度 + 秒差 * 树状态.速度 / 生长总秒数);
      const p = 树状态.进度;
      const 时间 = 现在 / 1000;
    
      // 樹幹：長高 + 變粗
      const f = 树干比例(p);
      const 粗 = 0.22 + 0.78 * 平滑(p / 0.95);
      树干.scale.set(粗, f, 粗);
      树干顶.copy(树顶).multiplyScalar(f);
    
      // 枝條：先長長，再慢慢變粗；次枝跟著主枝梢移動
      for (const 枝 of 树枝组) {
        const g = 平滑((p - 枝.起始) / 枝.时长);
        枝.生长 = g;
        if (枝.父) 枝.网格.position.copy(枝.父.起点).lerp(枝.父.终点, 枝.父.生长);
        枝.网格.visible = g > 0.001;
        const 枝粗 = g * (0.5 + 0.5 * 平滑(p));
        枝.网格.scale.set(枝粗, Math.max(g, 0.0001), 枝粗);
      }
    
      // 葉簇：彈出式長大
      for (const 叶 of 叶簇组) {
        const g = 回弹((p - 叶.起始) / 叶.时长);
        叶.网格.visible = g > 0.001;
        叶.网格.scale.set(叶.目标缩放.x * g, 叶.目标缩放.y * g, 叶.目标缩放.z * g);
      }
    
      // 頂芽：隨樹幹頂端上升，由小變大
      const 芽大小 = 0.22 + 0.85 * 平滑(p / 0.85);
      for (const 芽 of 顶芽组) {
        芽.网格.position.copy(树干顶).add(芽.偏移.clone().multiplyScalar(0.4 + 芽大小));
        芽.网格.scale.set(芽大小, 芽大小 * 0.85, 芽大小);
      }
    
      // 葉色漸變
      const 熟 = 平滑(p / 0.9);
      叶材质组.forEach((m, i) => m.color.copy(嫩叶色[i]).lerp(成熟色[i], 熟));
    
      // 幼樹隨風晃得更明顯，成樹沉穩
      const 摆幅 = 0.03 * (1.15 - p);
      树组.rotation.z = Math.sin(时间 * 0.9) * 摆幅;
      树组.rotation.x = Math.cos(时间 * 0.7) * 摆幅 * 0.6;
    }
    
    function 重播树() {
      树状态.进度 = 0;
      树状态.播放中 = true;
      树状态.上次 = performance.now();
    }

    // 程序化草丛与野花，控制数量以兼顾手机性能。
    const 草丛材质组 = [材质(0x438849), 材质(0x76ad59), 材质(0x9abf69)];
    for (let i = 0; i < 155; i++) {
      const 角 = 随机() * Math.PI * 2;
      const 半径 = Math.sqrt(随机()) * 7.2;
      const x = Math.cos(角) * 半径, z = Math.sin(角) * 半径;
      if ((x - 2) ** 2 + (z + 2) ** 2 < 5.5 || (x + 2) ** 2 + (z - 2) ** 2 < 5) continue;
      const 高 = 石头随机(0.16, 0.48);
      const 草 = new THREE.Mesh(new THREE.ConeGeometry(石头随机(0.045, 0.09), 高, 4), 草丛材质组[i % 草丛材质组.length]);
      草.position.set(x, 0.24 + 高 * 0.35, z);
      草.rotation.z = 石头随机(-0.28, 0.28);
      草.rotation.x = 石头随机(-0.18, 0.18);
      岛屿.add(草);
    }
    const 花材质组 = [材质(0xc9788c), 材质(0xe8b9c2), 材质(0xf3e8d8)];
    for (let i = 0; i < 20; i++) {
      const 角 = 随机() * Math.PI * 2, 半径 = 石头随机(3.1, 6.9);
      const x = Math.cos(角) * 半径, z = Math.sin(角) * 半径;
      const 花组 = new THREE.Group();
      const 花茎 = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.025, 0.28, 4), 草丛材质组[0]);
      花茎.position.y = 0.36;
      花组.add(花茎);
      for (let j = 0; j < 5; j++) {
        const 花瓣 = new THREE.Mesh(new THREE.SphereGeometry(0.075, 6, 5), 花材质组[i % 花材质组.length]);
        const 角度 = j * Math.PI * 2 / 5;
        花瓣.position.set(Math.cos(角度) * 0.09, 0.51, Math.sin(角度) * 0.09);
        花瓣.scale.set(1, 0.65, 0.8);
        花组.add(花瓣);
      }
      花组.position.set(x, 0, z);
      岛屿.add(花组);
    }

    // 房屋由墙体、木梁、门窗和独立瓦片组成。
    function 创建房屋(x, z, 比例, 朝向 = 0) {

      门把.position.set(0.13, 0.65, 1.27);
      房组.add(门把);
      const 窗框材质 = 木亮材质;
      const 窗玻璃 = 材质(0x9dd8e5, 0.28, { metalness: 0.05, emissive: 0x183a42, emissiveIntensity: 0.12 });
      for (const 窗X of [-0.78, 0.78]) {
        const 窗框 = new THREE.Mesh(new THREE.BoxGeometry(0.58, 0.62, 0.1), 窗框材质);
        窗框.position.set(窗X, 1.35, 1.22);
        房组.add(窗框);
        const 窗 = new THREE.Mesh(new THREE.BoxGeometry(0.43, 0.47, 0.11), 窗玻璃);
        窗.position.set(窗X, 1.36, 1.275);
        房组.add(窗);
        const 十字 = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.48, 0.03), 屋墙材质);
        十字.position.set(窗X, 1.36, 1.34);
        房组.add(十字);
      }
      /* 删除零散屋顶瓦片，避免屋顶细节显得杂乱。 */
      for (let i = 0; i < 0; i++) {
        const 瓦片 = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.09, 0.56), 屋顶材质[i % 屋顶材质.length]);
        const 边 = i % 2 === 0 ? -1 : 1;
        瓦片.position.set(边 * (0.25 + (i % 3) * 0.36), 2.72 + (i % 3) * 0.19, -0.7 + Math.floor(i / 2) * 0.42);
        瓦片.rotation.z = 边 * 0.35;
        房组.add(瓦片);
      }
      const 烟囱 = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.9, 0.38), 屋顶材质[0]);
      烟囱.position.set(0.65, 3.12, -0.25);
      房组.add(烟囱);
      const 烟团组 = new THREE.Group();
      for (let i = 0; i < 5; i++) {
        const 烟团 = new THREE.Mesh(new THREE.SphereGeometry(0.11 + i * 0.025, 7, 5), new THREE.MeshBasicMaterial({ color: 0xf2f4f2, transparent: true, opacity: 0.23 }));
        烟团.position.set(0.65 + Math.sin(i) * 0.1, 3.6 + i * 0.26, -0.25 + Math.cos(i * 1.4) * 0.08);
        烟团组.add(烟团);
      }
      房组.add(烟团组);
      房组.position.set(x, 0.18, z);
      房组.scale.setScalar(比例);
      房组.rotation.y = 朝向;
      岛屿.add(房组);
      return {组: 房组, 烟: 烟团组};
    }
    const 房屋组 = [创建房屋(-2.15, 2.0, 0.92, 0.2), 创建房屋(3.2, 3.55, 0.68, -0.5)];

    // 岛上小水潭，使用透明材质与动态波纹模拟清澈水面。
    const 水组 = new THREE.Group();
    水组.position.set(-4.2, 0.29, -1.2);
    岛屿.add(水组);
    const 水面材质 = new THREE.MeshPhysicalMaterial({ color: 0x69c9dd, roughness: 0.19, metalness: 0.06, clearcoat: 0.85, clearcoatRoughness: 0.16, transparent: true, opacity: 0.88 });
    const 水面 = new THREE.Mesh(new THREE.CircleGeometry(1.45, 40), 水面材质);
    水面.rotation.x = -Math.PI / 2;
    水面.scale.set(1.0, 0.7, 1);
    水面.position.y = 0.04;
    水组.add(水面);
    const 波纹组 = [];
    for (let i = 0; i < 3; i++) {
      const 波纹 = new THREE.Mesh(new THREE.RingGeometry(0.36 + i * 0.24, 0.39 + i * 0.24, 48), new THREE.MeshBasicMaterial({ color: 0xd5fbff, transparent: true, opacity: 0.45, side: THREE.DoubleSide }));
      波纹.rotation.x = -Math.PI / 2;
      波纹.position.y = 0.06 + i * 0.002;
      水组.add(波纹);
      波纹组.push(波纹);
    }

    // 瀑布使用多条半透明弯曲水带，并在落点生成水花。
    const 瀑布组 = new THREE.Group();
    瀑布组.position.set(-4.1, -0.3, -1.15);
    岛屿.add(瀑布组);
    const 水带组 = [];
    for (let i = 0; i < 5; i++) {
      const 点列 = [];
      for (let j = 0; j <= 12; j++) {
        const t = j / 12;
        点列.push(new THREE.Vector3((i - 2) * 0.13 + Math.sin(t * 4 + i) * 0.09, -t * 5.8, Math.cos(t * 3 + i) * 0.12));
      }
      const 曲线 = new THREE.CatmullRomCurve3(点列);
      const 几何 = new THREE.TubeGeometry(曲线, 18, 0.055 + (i % 2) * 0.025, 5, false);
      const 水带 = new THREE.Mesh(几何, new THREE.MeshBasicMaterial({ color: i % 2 ? 0x8ce8f2 : 0xe1fbff, transparent: true, opacity: 0.62 }));
      瀑布组.add(水带);
      水带组.push(水带);
    }
    const 水雾组 = new THREE.Group();
    for (let i = 0; i < 13; i++) {
      const 雾 = new THREE.Mesh(new THREE.SphereGeometry(石头随机(0.09, 0.22), 7, 5), new THREE.MeshBasicMaterial({ color: 0xe7fbff, transparent: true, opacity: 0.3 }));
      雾.position.set(石头随机(-0.7, 0.7), -5.6 + 石头随机(-0.2, 0.6), 石头随机(-0.35, 0.35));
      水雾组.add(雾);
    }
    瀑布组.add(水雾组);

    // 分层云团以多尺度软色块构成云海，靠漂移和呼吸缩放营造流动感。
    // =====================================================================
    // 雲層：雲海 + 中層流雲 + 高空薄雲
    // 用法：
    //  1. 刪掉原本從「分层云团以多尺度软色块…」到兩個 创建云团 的 for 迴圈結束的整段
    //     （包含 云组、云材质组、云团组、创建云团）
    //  2. 把本檔案貼在原處（场景、相机 之後）
    //  3. 動畫迴圈每幀呼叫： 更新云层();
    //     若原迴圈裡還有一段遍歷 云团组 的雲動畫，可直接刪掉（這裡保留了空的 云团组，不刪也不會報錯）
    //  4. 昼夜切換時呼叫： 设置云夜色(夜晚);   // true / false，會自動平滑過渡
    // 原理：用 canvas 畫出柔邊雲團貼圖，以 Sprite 取代球體，
    //       沒有硬邊、沒有透明排序穿幫，手機上也輕。
    // =====================================================================
    
    // ---------- 小工具（名稱加了「云」字頭，避免與別段程式重名）----------
    const 云随机生成 = (种子) => () => {
      种子 |= 0; 种子 = (种子 + 0x6D2B79F5) | 0;
      let t = Math.imul(种子 ^ (种子 >>> 15), 1 | 种子);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    const 云随机 = 云随机生成(77031);                 // 固定種子：每次載入同一片天空
    const 云范围 = (a, b) => a + 云随机() * (b - a);
    const 云夹 = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
    const 云平滑 = (t) => { t = 云夹(t); return t * t * (3 - 2 * t); };
    
    // ---------- 柔邊雲團貼圖（4 種，程式畫出來，不需外部圖片）----------
    function 创建云贴图(种子) {
      const 随机 = 云随机生成(种子);
      const 画布 = document.createElement("canvas");
      画布.width = 画布.height = 256;
      const c = 画布.getContext("2d");
      for (let i = 0; i < 15; i++) {
        const x = 128 + (随机() - 0.5) * 112;
        const y = 128 + (随机() - 0.5) * 54;
        const r = 36 + 随机() * 40;
        const g = c.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, "rgba(255,255,255,0.55)");
        g.addColorStop(0.55, "rgba(255,255,255,0.22)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        c.fillStyle = g;
        c.fillRect(0, 0, 256, 256);
      }
      // 邊緣羽化，確保貼圖四周完全透明
      c.globalCompositeOperation = "destination-in";
      const 遮罩 = c.createRadialGradient(128, 128, 22, 128, 128, 128);
      遮罩.addColorStop(0, "rgba(0,0,0,1)");
      遮罩.addColorStop(1, "rgba(0,0,0,0)");
      c.fillStyle = 遮罩;
      c.fillRect(0, 0, 256, 256);
      const 贴图 = new THREE.CanvasTexture(画布);
      贴图.encoding = THREE.sRGBEncoding;
      return 贴图;
    }
    const 云贴图组 = [101, 202, 303, 404].map(创建云贴图);
    
    // ---------- 參數 ----------
    const 云组 = new THREE.Group();
    场景.add(云组);
    const 云团组 = [];                                   // 相容舊程式：保留空陣列
    const 云组列表 = [];
    const 云状态 = {
      夜: 0, 夜目标: 0, 上次: performance.now(),
      风向: new THREE.Vector3(1, 0, 0.12).normalize(),
      减少动态: !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches),
      边界: 72                                           // 雲飄出這個範圍就從另一側回來
    };
    const 云昼色 = new THREE.Color(0xfaf7f0);
    const 云夜色 = new THREE.Color(0x46557a);
    const 云海昼色 = new THREE.Color(0xe4e9e2);          // 雲海底部略帶青灰，與霧色更貼
    const 云海夜色 = new THREE.Color(0x35435f);
    
    // 數量依螢幕寬度縮放（手機約 65%）
    const 密度 = innerWidth < 700 ? 0.82 : 1;
    const 云层配置 = [
      { 名: "云海", 数量: 30, y: [-13, -9],  半径: [7, 57],  簇: [8, 12], 尺寸: [9, 16],  速度: [0.07, 0.16], 不透明: 0.78, 扁: 0.56, 海: true },
      { 名: "中层", 数量: 14, y: [-6, -1.5], 半径: [20, 60], 簇: [5, 8], 尺寸: [7, 12],   速度: [0.14, 0.28], 不透明: 0.52, 扁: 0.46, 海: false },
      { 名: "高层", 数量: 8,  y: [15, 22],   半径: [18, 68], 簇: [4, 6], 尺寸: [11, 19], 速度: [0.22, 0.38], 不透明: 0.28, 扁: 0.32, 海: false }
    ];
    
    function 创建云(配置) {
      const 云 = new THREE.Group();
      const 簇数 = Math.floor(云范围(配置.簇[0], 配置.簇[1] + 0.99));
      const 基准尺寸 = 云范围(配置.尺寸[0], 配置.尺寸[1]);
      const 精灵列表 = [];
      for (let i = 0; i < 簇数; i++) {
        const 材质 = new THREE.SpriteMaterial({
          map: 云贴图组[Math.floor(云随机() * 云贴图组.length)],
          transparent: true,
          opacity: 配置.不透明,
          depthWrite: false,
          rotation: 云范围(-0.12, 0.12),
          color: 0xffffff
        });
        const 精灵 = new THREE.Sprite(材质);
        const 宽 = 基准尺寸 * 云范围(0.8, 1.3);
        精灵.position.set(云范围(-0.9, 0.9) * 基准尺寸, 云范围(-0.12, 0.2) * 基准尺寸 * 配置.扁, 云范围(-0.5, 0.5) * 基准尺寸);
        精灵.scale.set(宽, 宽 * 配置.扁 * 云范围(0.9, 1.15), 1);
        // 雲底顏色略深、上方略亮，增加體積感
        const 亮度 = 0.9 + 0.1 * (精灵.position.y / (基准尺寸 * 0.2) * 0.5 + 0.5);
        云.add(精灵);
        精灵列表.push({
          精灵, 基础缩放: 精灵.scale.clone(), 基础不透明: 配置.不透明 * 云范围(0.75, 1),
          亮度, 相位: 云随机() * Math.PI * 2
        });
      }
      const 角 = 云随机() * Math.PI * 2;
      const 半径 = 云范围(配置.半径[0], 配置.半径[1]);
      云.position.set(Math.cos(角) * 半径, 云范围(配置.y[0], 配置.y[1]), Math.sin(角) * 半径);
      云组.add(云);
      云组列表.push({
        组: 云, 精灵列表, 配置,
        速度: 云范围(配置.速度[0], 配置.速度[1]),
        相位: 云随机() * Math.PI * 2
      });
    }
    
    for (const 配置 of 云层配置) {
      const 数量 = Math.max(2, Math.round(配置.数量 * 密度));
      for (let i = 0; i < 数量; i++) 创建云(配置);
    }
    
    // ---------- 昼夜顏色 ----------
    function 设置云夜色(夜晚) {
      云状态.夜目标 = typeof 夜晚 === "number" ? 云夹(夜晚) : (夜晚 ? 1 : 0);
    }
    function 应用云颜色() {
      const 夜 = 云平滑(云状态.夜);
      const 临时 = new THREE.Color();
      for (const 云 of 云组列表) {
        const 昼 = 云.配置.海 ? 云海昼色 : 云昼色;
        const 暗 = 云.配置.海 ? 云海夜色 : 云夜色;
        临时.copy(昼).lerp(暗, 夜);
        for (const 项 of 云.精灵列表) {
          项.精灵.material.color.copy(临时).multiplyScalar(项.亮度);
        }
      }
    }
    应用云颜色();
    
    // ---------- 每幀更新 ----------
    function 更新云层() {
      const 现在 = performance.now();
      const 秒差 = Math.min(0.1, (现在 - 云状态.上次) / 1000);
      云状态.上次 = 现在;
      const 时间 = 现在 / 1000;
      const 动态 = 云状态.减少动态 ? 0.25 : 1;
    
      // 夜晚顏色平滑過渡（約 1.6 秒）
      if (Math.abs(云状态.夜目标 - 云状态.夜) > 0.001) {
        const 步 = 秒差 / 1.6;
        云状态.夜 += Math.sign(云状态.夜目标 - 云状态.夜) * Math.min(步, Math.abs(云状态.夜目标 - 云状态.夜));
        应用云颜色();
      }
    
      for (const 云 of 云组列表) {
        const 组 = 云.组;
        // 順風漂移 + 輕微上下浮動
        组.position.addScaledVector(云状态.风向, 云.速度 * 秒差 * 动态);
        组.position.y += Math.sin(时间 * 0.18 + 云.相位) * 0.0025 * 动态;
        if (组.position.x > 云状态.边界) {
          组.position.x = -云状态.边界;
          组.position.z = 云范围(-云状态.边界, 云状态.边界) * 0.9;
        }
    
        // 邊界淡入淡出：飄出範圍時漸隱，避免突然出現
        const 边缘 = 1 - 云平滑((Math.abs(组.position.x) - (云状态.边界 - 16)) / 16);
        // 相機靠近時淡出，避免大塊雲團糊住畫面
        const 距离 = 组.position.distanceTo(相机.position);
        const 近远 = 云平滑((距离 - 8) / 14);
        // 夜晚整體略透明一點，星空/月光感更乾淨
        const 夜透 = 1 - 0.18 * 云平滑(云状态.夜);
    
        for (const 项 of 云.精灵列表) {
          const 呼吸 = 1 + Math.sin(时间 * 0.3 + 项.相位) * 0.04 * 动态;
          项.精灵.scale.set(项.基础缩放.x * 呼吸, 项.基础缩放.y * (1 + (呼吸 - 1) * 0.6), 1);
          项.精灵.material.opacity = 项.基础不透明 * 边缘 * 近远 * 夜透;
        }
        组.visible = 边缘 * 近远 > 0.01;
      }
    }

    // 漂浮微粒、萤火虫与落叶，运动轨迹各自带有不同相位。
    const 微粒组 = new THREE.Group();
    场景.add(微粒组);
    const 微粒资料 = [];
    const 微粒材质组 = [
      new THREE.MeshBasicMaterial({ color: 0xffedbd, transparent: true, opacity: 0.85 }),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.72 }),
      new THREE.MeshBasicMaterial({ color: 0xffd6a4, transparent: true, opacity: 0.75 })
    ];
    for (let i = 0; i < 34; i++) {
      const 光点 = new THREE.Mesh(new THREE.SphereGeometry(石头随机(0.025, 0.065), 6, 5), 微粒材质组[i % 微粒材质组.length]);
      const 资料 = {中心X: 石头随机(-9, 9), 中心Y: 石头随机(0.8, 10), 中心Z: 石头随机(-8, 8), 相位: 随机() * Math.PI * 2, 速度: 石头随机(0.3, 0.9)};
      光点.position.set(资料.中心X, 资料.中心Y, 资料.中心Z);
      微粒组.add(光点);
      微粒资料.push({网格: 光点, ...资料});
    }
    const 落叶组 = new THREE.Group();
    场景.add(落叶组);
    const 落叶资料 = [];
    for (let i = 0; i < 12; i++) {
      const 叶片 = new THREE.Mesh(new THREE.PlaneGeometry(0.17, 0.28), 材质(i % 2 ? 0xc98c55 : 0xd8b56d, 0.9, { side: THREE.DoubleSide }));
      const 资料 = {x: 石头随机(-8, 8), y: 石头随机(1, 11), z: 石头随机(-7, 7), 相位: 随机() * 6.28, 速度: 石头随机(0.18, 0.42)};
      叶片.position.set(资料.x, 资料.y, 资料.z);
      落叶组.add(叶片);
      落叶资料.push({网格: 叶片, ...资料});
    }

    const 夜光 = new THREE.PointLight(0xffbd78,0,12);夜光.position.set(-2.1,2.0,3.2);岛屿.add(夜光);
    const 窗灯组=[];
    for(const 房屋 of 房屋组){const 灯材质=new THREE.MeshBasicMaterial({color:0xffc777,transparent:true,opacity:0});const 灯光片=new THREE.Mesh(new THREE.PlaneGeometry(0.34,0.38),灯材质);灯光片.position.set(-0.78*(房屋.组.scale.x/0.92),1.36*(房屋.组.scale.y/0.92),1.34*(房屋.组.scale.z/0.92));房屋.组.add(灯光片);const 点灯=new THREE.PointLight(0xffb96b,0,4.5);点灯.position.set(0,1.45,1.8);房屋.组.add(点灯);窗灯组.push({材质:灯材质,灯:点灯});}
    const 时钟=new THREE.Clock();let 总时间=0;let 上次时间=0;let 动画帧=0;const 减少动态=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;let 上次日照刷新=0;
    function 更新真实天空(){
      const now=new Date();const parts=Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"}).formatToParts(now).map(p=>[p.type,p.value]));const hour=Number(parts.hour)+Number(parts.minute)/60+Number(parts.second)/3600;const taipeiDate=new Date(Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day),12));const sun=计算台北日出日落(taipeiDate);const sunrise=sun.日出,sunset=sun.日落;const dayLength=sunset-sunrise;const progress=(hour-sunrise)/dayLength;const daylight=hour>=sunrise&&hour<=sunset;
      const dawn=(hour>=sunrise-0.85&&hour<sunrise+1.15);const dusk=(hour>=sunset-1.15&&hour<sunset+0.85);const twilight=dawn||dusk;const night=hour<sunrise-0.85||hour>sunset+0.85?1:0;const solar=Math.sin(Math.PI*Math.max(0,Math.min(1,progress)));const elevation=daylight?0.06+0.9*solar:-0.12;const angle=(hour-12)/12*Math.PI;const dir=new THREE.Vector3(Math.sin(angle),elevation,-Math.cos(angle)).normalize();
      天空参数.uniforms.uSunHeight.value=elevation;天空参数.uniforms.uTwilight.value=twilight?Math.max(0.22,1-Math.min(Math.abs(hour-sunrise),Math.abs(hour-sunset))/1.35):0;天空参数.uniforms.uNight.value=night;天空参数.uniforms.uSunDir.value.copy(dir);天空参数.uniforms.uTime.value=hour*3600;
      const warm=twilight?1:0;const fog=new THREE.Color(0xcbd8d0).lerp(new THREE.Color(0xe1a58b),warm*0.58).lerp(new THREE.Color(0x263449),night);场景.fog.color.copy(fog);
      环境光.color.set(0xf0eadc).lerp(new THREE.Color(0x8792ad),night).lerp(new THREE.Color(0xf5c7a3),warm*0.18);环境光.groundColor.set(0x596b50).lerp(new THREE.Color(0x303844),night);环境光.intensity=THREE.MathUtils.lerp(1.15,0.62,night)*(twilight?0.94:1);
      阳光.color.set(0xffe7c7).lerp(new THREE.Color(0xffa16c),warm*0.72).lerp(new THREE.Color(0x9ca8ce),night);阳光.intensity=night?0.32:THREE.MathUtils.lerp(0.55,2.05,Math.max(0,solar));阳光.position.set(dir.x*55,Math.max(4,dir.y*55),dir.z*55);渲染器.toneMappingExposure=THREE.MathUtils.lerp(0.82,1.05,1-night)*(twilight?0.96:1);
      夜光.intensity=1.8*night;窗灯组.forEach(x=>{x.材质.opacity=0.95*night;x.灯.intensity=1.1*night;});微粒材质组.forEach((m,i)=>{m.opacity=THREE.MathUtils.lerp(i===0?0.22:0.12,0.95,night);m.color.set(night?0xffd778:(i===1?0xffffff:0xffedbd));});台北日照.日出=sunrise;台北日照.日落=sunset;台北日照.日间比例=progress;台北日照.夜间比例=night;设置云夜色(night);上次日照刷新=Date.now();
    }
    document.getElementById("复位").addEventListener("click", () => {
      相机.position.copy(初始相机);
      控制器.target.set(0, 2.4, 0);
      控制器.update();
    });

    function 动画() {
      动画帧 = requestAnimationFrame(动画);
      const 经过 = Math.min(时钟.getDelta(), 0.05);
      总时间 += 经过;
      控制器.update();
      if (Date.now() - 上次日照刷新 > 30000) 更新真实天空();
      更新树生长();
      更新云层();
      if (!减少动态) {
        岛屿.position.y = Math.sin(总时间 * 0.48) * 0.22;
        叶簇组.forEach(项 => {
          项.网格.rotation.z = 项.原位 + Math.sin(总时间 * 1.25 + 项.相位) * 0.035;
        });
        波纹组.forEach((波纹, i) => {
          const 循环 = (总时间 * 0.22 + i / 3) % 1;
          波纹.scale.setScalar(0.7 + 循环 * 1.2);
          波纹.material.opacity = 0.42 * (1 - 循环);
        });
        水面.position.y = 0.04 + Math.sin(总时间 * 1.5) * 0.018;
        水带组.forEach((水带, i) => {
          水带.position.x = Math.sin(总时间 * 1.8 + i) * 0.035;
        });
        水雾组.children.forEach((雾, i) => {
          雾.position.y = -5.6 + ((总时间 * 0.32 + i * 0.19) % 1.2);
          雾.position.x += Math.sin(总时间 + i) * 0.0008;
          雾.material.opacity = 0.16 + Math.sin(总时间 * 2 + i) * 0.09;
        });
        微粒资料.forEach(项 => {
          项.网格.position.x = 项.中心X + Math.sin(总时间 * 项.速度 + 项.相位) * 0.55;
          项.网格.position.y = 项.中心Y + Math.sin(总时间 * 1.2 + 项.相位) * 0.38;
          项.网格.position.z = 项.中心Z + Math.cos(总时间 * 0.6 + 项.相位) * 0.42;
          const 呼吸 = 0.45 + 0.55 * (0.5 + 0.5 * Math.sin(总时间 * 2.4 + 项.相位));
          项.网格.scale.setScalar(台北日照.夜间比例 > 0.5 ? 0.65 + 呼吸 : 0.6 + 呼吸 * 0.35);
        });
        落叶资料.forEach(项 => {
          项.网格.position.y = 1 + ((项.y - 总时间 * 项.速度 + 10) % 10);
          项.网格.position.x = 项.x + Math.sin(总时间 * 0.7 + 项.相位) * 0.8;
          项.网格.position.z = 项.z + Math.cos(总时间 * 0.5 + 项.相位) * 0.55;
          项.网格.rotation.set(Math.sin(总时间 + 项.相位) * 0.6, 总时间 * 0.45 + 项.相位, Math.cos(总时间 * 0.8 + 项.相位) * 0.45);
        });
        房屋组.forEach((房屋, i) => {
          房屋.烟.children.forEach((烟, j) => {
            烟.position.y = 3.6 + j * 0.26 + Math.sin(总时间 * 0.6 + j + i) * 0.12;
            烟.position.x = 0.65 + Math.sin(总时间 * 0.7 + j * 1.4) * (0.1 + j * 0.04);
            烟.material.opacity = 0.12 + (1 - j / 6) * 0.16;
          });
        });
      }
      渲染器.render(场景, 相机);
    }

    function 调整画面() {
      const 宽 = window.innerWidth;
      const 高 = window.innerHeight;
      相机.aspect = 宽 / 高;
      // 竖屏稍微拉远相机，避免岛屿顶部或底部被裁切。
      if (高 > 宽) {
        相机.fov = 43;
        控制器.maxDistance = 100;
      } else {
        相机.fov = 39;
        控制器.maxDistance = 100;
      }
      相机.updateProjectionMatrix();
      渲染器.setPixelRatio(Math.min(window.devicePixelRatio || 1, 宽 < 600 ? 1.35 : 1.6));
      渲染器.setSize(宽, 高);
    }
    window.addEventListener("resize", 调整画面, { passive: true });
    window.addEventListener("orientationchange", () => setTimeout(调整画面, 180), { passive: true });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        时钟.getDelta();
        渲染器.render(场景, 相机);
      }
    });
    更新真实天空();
    调整画面();
    动画();
  })();
  </script>
